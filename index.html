<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一个简洁、现代、支持本地持久化的 Todo List。" />
  <title>FocusList · Todo List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="todo-app" aria-labelledby="app-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">TODAY</p>
          <h1 id="app-title">FocusList</h1>
          <p class="subtitle" id="today-label">把今天的重要事情一件件完成。</p>
        </div>
        <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="切换深色模式" title="切换主题">
          <span class="theme-icon" aria-hidden="true">☾</span>
        </button>
      </header>

      <form class="add-form" id="todo-form" autocomplete="off">
        <label class="sr-only" for="todo-input">添加待办事项</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">＋</span>
          <input
            id="todo-input"
            name="todo"
            type="text"
            maxlength="120"
            placeholder="添加一项待办，例如：完成项目周报"
            aria-describedby="input-hint"
            required
          />
        </div>
        <button class="primary-button" type="submit">添加任务</button>
      </form>
      <p class="input-hint" id="input-hint">按 Enter 快速添加，最多 120 个字符。</p>

      <section class="stats" aria-label="任务统计">
        <article class="stat-card">
          <span class="stat-value" id="total-count">0</span>
          <span class="stat-label">全部任务</span>
        </article>
        <article class="stat-card">
          <span class="stat-value" id="active-count">0</span>
          <span class="stat-label">待完成</span>
        </article>
        <article class="stat-card">
          <span class="stat-value" id="completed-count">0</span>
          <span class="stat-label">已完成</span>
        </article>
      </section>

      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="筛选任务">
          <button class="filter-button is-active" type="button" data-filter="all" role="tab" aria-selected="true">全部</button>
          <button class="filter-button" type="button" data-filter="active" role="tab" aria-selected="false">待办</button>
          <button class="filter-button" type="button" data-filter="completed" role="tab" aria-selected="false">已完成</button>
        </div>
        <button class="text-button" id="clear-completed" type="button" disabled>清除已完成</button>
      </div>

      <section class="task-section" aria-live="polite">
        <ul class="task-list" id="task-list" aria-label="待办事项列表"></ul>

        <div class="empty-state" id="empty-state">
          <div class="empty-illustration" aria-hidden="true">
            <svg viewBox="0 0 120 120" role="img">
              <rect x="28" y="22" width="64" height="78" rx="12"></rect>
              <path d="M44 45h32M44 60h24M44 75h18"></path>
              <circle cx="84" cy="84" r="18"></circle>
              <path d="m76 84 6 6 11-13"></path>
            </svg>
          </div>
          <h2 id="empty-title">还没有待办事项</h2>
          <p id="empty-description">从上方添加第一项任务，开始清空你的待办清单。</p>
        </div>
      </section>

      <footer class="app-footer">
        <p><span id="footer-active-count">0</span> 项任务待完成</p>
        <p class="save-status"><span class="status-dot" aria-hidden="true"></span> 已自动保存在本机</p>
      </footer>
    </section>
  </main>

  <template id="task-template">
    <li class="task-item">
      <label class="check-control">
        <input class="task-checkbox" type="checkbox" />
        <span class="custom-checkbox" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"></path></svg>
        </span>
        <span class="sr-only">标记任务完成</span>
      </label>

      <div class="task-content">
        <p class="task-text"></p>
        <p class="task-meta"></p>
      </div>

      <div class="task-actions">
        <button class="task-action edit-task" type="button" aria-label="编辑任务" title="编辑">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
        </button>
        <button class="task-action delete-task" type="button" aria-label="删除任务" title="删除">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
        </button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
